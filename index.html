<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Axis - Finance</title>

  <link rel="stylesheet" href="./css/style.css">
</head>

<body>




  <aside>
    <div class="logo-container">
      <span class="logo">Axis</span>
    </div>
    <nav>
      <ul>
        <li class="nav-item"><a href="#">Overview</a></li>
        <li class="nav-item"><a href="#">Lançamentos</a></li>
        <li class="nav-item"><a href="#">Configurações</a></li>
      </ul>
    </nav>
  </aside>

  <main class="overview-main">
    <div class="title-container">
      <h1 class="title">Overview</h1>
    </div>

    <section class="financial-summary">
      <div class="card">
        <h2>Saldo disponível</h2>
        <span>R$ 2.000,00</span>
      </div>
      <div class="card">
        <h2>Entradas</h2>
        <span>R$ 1.500,00</span>
      </div>
      <div class="card">
        <h2>Saídas</h2>
        <span>R$ 500,00</span>
      </div>
      <div class="card">
        <h2>Investimentos</h2>
        <span>R$ 0</span>
      </div>
    </section>

    <section class="categorias-container">
      <div class="categorias">
        <div class="categorias-lista">
          <div class="categorias-item">
            <span>Investimentos</span>
            <span>25%</span>
          </div>
          <div class="categorias-item">
            <span>Custos Fixos</span>
            <span>30%</span>
          </div>
          <div class="categorias-item">
            <span>Conforto</span>
            <span>15%</span>
          </div>
          <div class="categorias-item">
            <span>Curto/Médio Prazo</span>
            <span>15%</span>
          </div>
          <div class="categorias-item">
            <span>Prazeres</span>
            <span>10%</span>
          </div>
          <div class="categorias-item">
            <span>Conhecimento</span>
            <span>5%</span>
          </div>
        </div>

        <div class="categorias-grafico">
          Gráfico aqui
        </div>
      </div>
    </section>


  </main>


  <script type="module" src="script.js"></script>
</body>

</html>
